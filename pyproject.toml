[project]
name = "iguide-hand"
version = "0.1.0"
description = "Python scripts for Height Above Nearest Drainage (HAND) inundation mapping workflow for aging dams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas==1.0.1",
    "rasterio==1.4.3",
]

[dependency-groups]
notebook = [
    "ipykernel",
    "matplotlib",
]

# The pipeline scripts are top-level modules in src/ (they import each other
# as `from utils import ...`), so list them explicitly; packages.find would
# miss them in a non-editable install.
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "utils",
    "dam_catchments",
    "dam_hand",
    "dam_hydroprop",
    "dam_inundation",
    "generate_segment_outlets",
    "dam_setup",
]
packages = []

[project.scripts]
dam_catchments = "dam_catchments:main"
dam_hand = "dam_hand:main"
dam_hydroprop = "dam_hydroprop:main"
dam_inundation = "dam_inundation:main"
dam_outlets = "generate_segment_outlets:main"

[tool.uv]
package = true